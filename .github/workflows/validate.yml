name: validate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Validate AquaInSAR W1 package
        run: |
          if [ ! -d AquaInSAR_W1 ]; then
            echo "AquaInSAR_W1 is not present on this ref; skipping package checks."
            exit 0
          fi
          python -m json.tool AquaInSAR_W1/contracts/AquaInSAR_Data_Contract_v0.9.0.json > /dev/null
          export PYTHONPATH="$PWD/AquaInSAR_W1/src"
          python -m aquainsar_w1.contract_tools check-contract \
            --contract AquaInSAR_W1/contracts/AquaInSAR_Data_Contract_v0.9.0.json
          python -m unittest discover -s AquaInSAR_W1/tests -v
          python -m compileall -q AquaInSAR_W1/src AquaInSAR_W1/tests
